<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minimal Funky Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: #fff;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s, filter 0.3s;
      border-radius: 6px;
    }

    .gallery img:hover {
      transform: scale(1.05) skewY(-2deg);
      filter: brightness(1.2) contrast(1.2);
    }

    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 999;
    }

    .lightbox.active {
      visibility: visible;
      opacity: 1;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3rem;
      color: white;
      cursor: pointer;
      padding: 0 20px;
      user-select: none;
    }

    .nav-btn.left { left: 0; }
    .nav-btn.right { right: 0; }

    .spinner {
  position: absolute;
  width: 50px;
  height: 50px;
  border: 5px solid rgba(255,255,255,0.2);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  z-index: 1000;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
}

@keyframes spin {
  to {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}


  </style>
</head>
<body>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <div class="spinner" id="spinner"></div>
  <div class="nav-btn left" id="prev">&#10094;</div>
  <img src="" alt="Preview" id="lightbox-img">
  <div class="nav-btn right" id="next">&#10095;</div>
</div>

<script>
  const gallery = document.getElementById('gallery');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const nextBtn = document.getElementById('next');
  const prevBtn = document.getElementById('prev');

  let images = [];
  let currentIndex = 0;

  fetch('assets/pictures.json')
    .then(response => response.json())
    .then(data => {
      images = data;

      // Populate gallery once
      images.forEach((img, index) => {
        const thumb = document.createElement('img');
        thumb.src = img.thumb;
        thumb.alt = img.alt || '';
        thumb.dataset.index = index;
        gallery.appendChild(thumb);
      });

      // Set up lightbox events once
      gallery.addEventListener('click', e => {
        if (e.target.tagName === 'IMG') {
          const index = +e.target.dataset.index;
          showLightbox(index);
        }
      });

      nextBtn.onclick = () => showLightbox((currentIndex + 1) % images.length);
      prevBtn.onclick = () => showLightbox((currentIndex - 1 + images.length) % images.length);

      lightbox.addEventListener('click', e => {
        if (e.target === lightbox || e.target === lightboxImg) {
          lightbox.classList.remove('active');
        }
      });

      document.addEventListener('keydown', e => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') lightbox.classList.remove('active');
        if (e.key === 'ArrowRight') nextBtn.click();
        if (e.key === 'ArrowLeft') prevBtn.click();
      });
    });

  function showLightbox(index) {
  currentIndex = index;
  const imgData = images[index];
  const spinner = document.getElementById('spinner');
  const lightboxImg = document.getElementById('lightbox-img');

  spinner.style.display = 'block';
  lightbox.classList.add('active');

  // Clear old image src to avoid flash of previous image
  lightboxImg.src = '';
  lightboxImg.alt = '';

  // Create a temp image to preload
  const tempImg = new Image();
  tempImg.src = imgData.full;
  tempImg.alt = imgData.alt || '';

  tempImg.onload = () => {
    lightboxImg.src = tempImg.src;
    lightboxImg.alt = tempImg.alt;
    spinner.style.display = 'none';
  };

  tempImg.onerror = () => {
    spinner.style.display = 'none';
    lightboxImg.alt = 'Failed to load image';
  };
}

</script>

</body>
</html>
